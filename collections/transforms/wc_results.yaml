owner_user_id: api-key-user-8e50a750-058e-4e80-ac9c-11fda16e2a7c@api-key.invalid
source:
  query:
    database: Dirty Warehouse
    stages:
    - native: |
        SELECT
          m.match_no,
          m.group_name,
          m.match_date,
          m.team1,
          m.team2,
          CAST(NULL AS integer) AS goals1,
          CAST(NULL AS integer) AS goals2,
          false                 AS is_final
        FROM public.wc_matches m
        WHERE m.stage = 'Group Stage'
        ORDER BY m.match_no
      lib/type: mbql.stage/native
    lib/type: mbql/query
