          ('Final','2026-07-19','15:00 UTC-4','W101','W102',NULL,'New York/New Jersey (East Rutherford)')
        )
        SELECT
          row_number() OVER (ORDER BY r.match_date::date,
                             split_part(r.match_time, ' ', 1)::time, r.team1)  AS match_no,
          CASE WHEN r.group_name IS NOT NULL THEN 'Group Stage' ELSE r.round END AS stage,
          (r.group_name IS NULL)                                  AS is_knockout,
          r.round,
          r.match_date::date                                      AS match_date,
          split_part(r.match_time, ' ', 1)                        AS kickoff_local,
          split_part(r.match_time, ' ', 2)                        AS kickoff_tz,
          r.group_name,
          r.team1,
          t1.fifa_rank                                            AS team1_rank,
          r.team2,
          t2.fifa_rank                                            AS team2_rank,
          CASE WHEN t1.fifa_rank IS NOT NULL AND t2.fifa_rank IS NOT NULL
               THEN round((t1.fifa_rank + t2.fifa_rank) / 2.0, 1) END AS matchup_avg_rank,
          r.ground,
          v.stadium,
          v.country,
          v.capacity
        FROM raw r
        LEFT JOIN public.wc_venues v ON r.ground = v.ground
        LEFT JOIN public.wc_teams t1 ON r.team1 = t1.team
        LEFT JOIN public.wc_teams t2 ON r.team2 = t2.team
