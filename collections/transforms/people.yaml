description: 'Registrants: one row per person who appears in registrations, enriched with their matched CRM company, tier, region, and lifecycle stage.'
entity_id: TZirz2r9ta9tOVLwbAPRU
name: people
owner_user_id: api-key-user-8e50a750-058e-4e80-ac9c-11fda16e2a7c@api-key.invalid
source:
  query:
    database: Dirty Warehouse
    stages:
    - native: |
        WITH crm AS (
          SELECT DISTINCT ON (email)
            email, contact_id, company_id, company_name,
            company_tier, company_region, lifecycle_stage, lead_source
          FROM public.contacts
          WHERE email IS NOT NULL
          ORDER BY email, contact_id
        )
        SELECT
          p.uid                                                   AS person_id,
          initcap(btrim(p.full_name))                             AS full_name,
          lower(btrim(p.email))                                   AS email,
          CASE
            WHEN p.created ~ '^\d{4}-\d{2}-\d{2}T'  THEN (p.created::timestamptz)::date
            WHEN p.created ~ '^\d{4}-\d{2}-\d{2}$'  THEN to_date(p.created, 'YYYY-MM-DD')
            WHEN p.created ~ '^\d{2}/\d{2}/\d{4}$'  THEN to_date(p.created, 'MM/DD/YYYY')
            WHEN p.created ~ '^\d{4}/\d{2}/\d{2}$'  THEN to_date(p.created, 'YYYY/MM/DD')
            WHEN p.created ~ '^\d{2}-[A-Za-z]{3}-\d{4}$' THEN to_date(p.created, 'DD-Mon-YYYY')
            ELSE NULL
          END                                                     AS created_on,
          (crm.contact_id IS NOT NULL)                            AS is_crm_customer,
          crm.contact_id                                          AS crm_contact_id,
          crm.company_id,
          crm.company_name,
          crm.company_tier,
          crm.company_region,
          crm.lifecycle_stage,
          crm.lead_source
        FROM events.evt_people p
        LEFT JOIN crm ON lower(btrim(p.email)) = crm.email
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
