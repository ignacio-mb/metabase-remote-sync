source:
  query:
    database: Dirty Warehouse
    stages:
    - native: |
        SELECT
          m.match_no,
          m.group_name,
          m.match_date,
          m.kickoff_local,
          m.kickoff_tz,
          m.team1,
          f1.flag                  AS team1_flag,
          f1.team_label            AS team1_label,
          m.team1_rank,
          m.team2,
          f2.flag                  AS team2_flag,
          f2.team_label            AS team2_label,
          m.team2_rank,
          m.stadium,
          m.country
        FROM public.wc_matches m
        LEFT JOIN public.wc_team_flags f1 ON m.team1 = f1.team
        LEFT JOIN public.wc_team_flags f2 ON m.team2 = f2.team
        WHERE m.stage = 'Group Stage'
        ORDER BY m.match_no
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
