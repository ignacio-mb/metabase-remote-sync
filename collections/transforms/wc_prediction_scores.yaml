description: 'Scoring: each user''s prediction vs the actual result. Exact score = 5 pts, correct outcome (win/draw/loss) = 3, else 0; NULL until the match is played.'
entity_id: BAilatwbTI-VcBKJvJh5U
name: wc_prediction_scores
owner_user_id: api-key-user-8e50a750-058e-4e80-ac9c-11fda16e2a7c@api-key.invalid
source:
  query:
    database: Dirty Warehouse
    stages:
    - native: |
        SELECT
          p.username,
          p.match_no,
          p.group_name,
          p.team1,
          p.team2,
          p.pred_goals1,
          p.pred_goals2,
          r.goals1 AS actual_goals1,
          r.goals2 AS actual_goals2,
          CASE
            WHEN r.goals1 IS NULL OR r.goals2 IS NULL THEN NULL
            WHEN p.pred_goals1 = r.goals1 AND p.pred_goals2 = r.goals2 THEN 5
            WHEN sign(p.pred_goals1 - p.pred_goals2) = sign(r.goals1 - r.goals2) THEN 3
            ELSE 0
          END AS points
        FROM public.wc_predictions p
        LEFT JOIN public.wc_results r ON p.match_no = r.match_no
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
source_database_id: Dirty Warehouse
