name: wc_leaderboard
owner_user_id: api-key-user-8e50a750-058e-4e80-ac9c-11fda16e2a7c@api-key.invalid
source:
  query:
    database: Dirty Warehouse
    stages:
    - native: |
        SELECT
          username,
          count(*) FILTER (WHERE points IS NOT NULL)  AS matches_scored,
          count(*) FILTER (WHERE points = 5)          AS exact_scores,
          count(*) FILTER (WHERE points = 3)          AS correct_outcomes,
          coalesce(sum(points), 0)                    AS total_points,
          rank() OVER (ORDER BY coalesce(sum(points), 0) DESC) AS rank
        FROM public.wc_prediction_scores
        GROUP BY username
        ORDER BY total_points DESC
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
source_database_id: Dirty Warehouse
